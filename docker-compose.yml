services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuquery-postgres
    restart: always
    environment:
      POSTGRES_DB: docuquery_db
      POSTGRES_USER: docuquery_user
      POSTGRES_PASSWORD: docuquery_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

