spring:
  application:
    name: docuquery

  datasource:
    url: jdbc:postgresql://localhost:5432/docuquery
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update     # Hibernate Updates your tables based on JPA entities
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        think: false
        options:
          model: qwen3.5:4b
          temperature: 0.3
          num-ctx: 4096
          num-predict: 256

      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB